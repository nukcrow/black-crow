name: Auto-update Subscriptions

on:
  schedule:
    - cron: '0 */3 * * *'   # اجرای خودکار هر ۳ ساعت یک‌بار
  workflow_dispatch:        # امکان اجرای دستی از تب Actions

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Subscriptions Switcher
        run: python scripts/switcher.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sub/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update subscriptions [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)

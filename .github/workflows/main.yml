name: Auto-update Subscriptions

on:
  schedule:
    # Every 3 hours at minute 17
    - cron: "17 */3 * * *"

  workflow_dispatch:

concurrency:
  group: auto-update-subscriptions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true


      # ==================================================
      # PYTHON
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ==================================================
      # DEPENDENCIES
      # ==================================================

      - name: Install Dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check requests


      # ==================================================
      # XRAY
      # ==================================================

      - name: Install Xray
        continue-on-error: true
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/xray"

          curl -fsSL --retry 3 \
            -o "$RUNNER_TEMP/xray.zip" \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip

          unzip -q -o "$RUNNER_TEMP/xray.zip" xray -d "$RUNNER_TEMP/xray"

          chmod +x "$RUNNER_TEMP/xray/xray"

          echo "$RUNNER_TEMP/xray" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/xray/xray" version | head -n 1


      # ==================================================
      # STATE CACHE
      # ==================================================

      - name: Restore Good-Config Pool
        uses: actions/cache@v4
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: |
            state-


      # ==================================================
      # SYNC MAIN
      # ==================================================

      - name: Sync Latest Main
        run: |
          set -euo pipefail

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          echo "Current commit:"
          git log -1 --oneline


      # ==================================================
      # RUN COLLECTOR
      # ==================================================

      - name: Run NukCrow Collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          echo "UTC: $(date -u)"
          python --version

          python scripts/switcher.py


      # ==================================================
      # VERIFY OUTPUT DIRECTORY
      # ==================================================

      - name: Verify Output Directory
        run: |
          set -euo pipefail

          if [ ! -d "sub/general" ]; then
            echo "ERROR: sub/general does not exist!"
            exit 1
          fi

          echo "OK: sub/general exists."


      # ==================================================
      # RANDOM 200 MUST NOT EXIST
      # ==================================================

      - name: Verify Random 200 Removed
        run: |
          set -euo pipefail

          if [ -e "sub/general/random_200.txt" ]; then
            echo "ERROR: random_200.txt must NOT exist!"
            exit 1
          fi

          echo "OK: random_200.txt does not exist."


      # ==================================================
      # EXPECTED FILES
      # ==================================================

      - name: Verify Expected Files
        shell: bash
        run: |
          set -euo pipefail

          expected_files=(
            "sub/general/all_configs.txt"

            "sub/general/sub1.txt"
            "sub/general/sub2.txt"
            "sub/general/sub3.txt"
            "sub/general/sub4.txt"
            "sub/general/sub5.txt"
            "sub/general/sub6.txt"
            "sub/general/sub7.txt"
            "sub/general/sub8.txt"
            "sub/general/sub9.txt"
            "sub/general/sub10.txt"

            "sub/general/mci.txt"
            "sub/general/irancell.txt"
            "sub/general/rightel.txt"

            "sub/general/best_iran.txt"
            "sub/general/mix_iran.txt"

            "sub/general/vless.txt"
            "sub/general/vmess.txt"
            "sub/general/trojan.txt"
            "sub/general/ss.txt"
            "sub/general/hysteria2.txt"
          )

          for file in "${expected_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi
          done

          mapfile -t actual_files < <(
            find sub/general \
              -maxdepth 1 \
              -type f \
              -name "*.txt" \
              -printf "%p\n" \
              | sort
          )

          mapfile -t sorted_expected < <(
            printf '%s\n' "${expected_files[@]}" | sort
          )

          if ! diff -u \
            <(printf '%s\n' "${sorted_expected[@]}") \
            <(printf '%s\n' "${actual_files[@]}"); then

            echo "ERROR: Unexpected or missing .txt files detected!"
            exit 1
          fi

          echo "OK: file list is exactly correct."


      # ==================================================
      # COUNTS
      # ==================================================

      - name: Validate Counts
        shell: bash
        run: |
          set -euo pipefail

          count_lines() {
            grep -cve '^[[:space:]]*$' "$1" || true
          }

          check_exact() {
            local file="$1"
            local expected="$2"
            local count

            count="$(count_lines "$file")"

            echo "$file: $count configs"

            if [ "$count" -ne "$expected" ]; then
              echo "ERROR: $file must contain exactly $expected configs!"
              exit 1
            fi
          }

          check_range() {
            local file="$1"
            local min="$2"
            local max="$3"
            local count

            count="$(count_lines "$file")"

            echo "$file: $count configs"

            if [ "$count" -lt "$min" ] || [ "$count" -gt "$max" ]; then
              echo "ERROR: $file must contain $min-$max configs!"
              exit 1
            fi
          }

          echo "=== ALL CONFIGS ==="

          check_exact \
            "sub/general/all_configs.txt" \
            10000

          total="$(count_lines sub/general/all_configs.txt)"

          if [ "$total" -ne 10000 ]; then
            echo "ERROR: all_configs.txt must contain exactly 10000 configs!"
            exit 1
          fi


          echo ""
          echo "=== GENERAL SUBSCRIPTIONS ==="

          for i in $(seq 1 10); do
            check_exact \
              "sub/general/sub${i}.txt" \
              1000
          done


          echo ""
          echo "=== PROTOCOL SUBSCRIPTIONS ==="

          for proto in \
            vless \
            vmess \
            trojan \
            ss \
            hysteria2
          do
            check_range \
              "sub/general/${proto}.txt" \
              1 \
              100
          done


          echo ""
          echo "=== IRAN / OPERATOR SUBSCRIPTIONS ==="

          for file in \
            sub/general/mci.txt \
            sub/general/irancell.txt \
            sub/general/rightel.txt \
            sub/general/best_iran.txt \
            sub/general/mix_iran.txt
          do
            check_range "$file" 1 200
          done


          echo ""
          echo "OK: all counts are correct."


      # ==================================================
      # VERIFY SUBSCRIPTION ORDER
      # ==================================================

      - name: Verify Subscription Order
        shell: bash
        run: |
          set -euo pipefail

          tmp_file="$(mktemp)"

          trap 'rm -f "$tmp_file"' EXIT

          for i in $(seq 1 10); do
            cat "sub/general/sub${i}.txt" >> "$tmp_file"
          done

          if ! cmp -s \
            "$tmp_file" \
            "sub/general/all_configs.txt"; then

            echo "ERROR: sub1..sub10 do not exactly match all_configs.txt!"
            exit 1
          fi

          echo "OK: sub1 -> sub10 exactly match all_configs.txt."


      # ==================================================
      # VERIFY EACH SUB FILE SIZE
      # ==================================================

      - name: Verify Subscription Sizes
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 10); do
            file="sub/general/sub${i}.txt"

            count="$(grep -cve '^[[:space:]]*$' "$file" || true)"

            if [ "$count" -ne 1000 ]; then
              echo "ERROR: $file contains $count configs, expected 1000."
              exit 1
            fi
          done

          echo "OK: every general subscription contains exactly 1000 configs."


      # ==================================================
      # EMPTY LINE CHECK
      # ==================================================

      - name: Validate Empty Lines
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r file; do

            if grep -nE '^[[:space:]]*$' "$file" | grep -q .; then
              echo "ERROR: Empty line found in $file"
              exit 1
            fi

          done < <(
            find sub/general \
              -maxdepth 1 \
              -type f \
              -name "*.txt"
          )

          echo "OK: no empty lines found."


      # ==================================================
      # PROTOCOL FORMAT CHECK
      # ==================================================

      - name: Validate Protocol Format
        shell: bash
        run: |
          set -euo pipefail

          bad_format=0

          while IFS= read -r file; do

            if grep -vE \
              '^(vless|vmess|trojan|ss|hysteria2|hy2)://.+#nukcrow$' \
              "$file" | grep -q .; then

              echo "ERROR: Invalid config format found in $file"
              bad_format=1
            fi

          done < <(
            find sub/general \
              -maxdepth 1 \
              -type f \
              -name "*.txt"
          )

          if [ "$bad_format" -ne 0 ]; then
            echo "ERROR: Protocol format validation failed!"
            exit 1
          fi

          echo "OK: all configs have valid protocol format."


      # ==================================================
      # REMARK CHECK
      # ==================================================

      - name: Validate Remarks
        shell: bash
        run: |
          set -euo pipefail

          bad_remark=0

          while IFS= read -r file; do

            if grep -vE '#nukcrow$' "$file" | grep -q .; then
              echo "ERROR: Invalid remark found in $file"
              bad_remark=1
            fi

            if grep -vE '^([^#]*#nukcrow)$' "$file" | grep -q .; then
              echo "ERROR: Extra remark/fragment found in $file"
              bad_remark=1
            fi

            if grep -E \
              '#(Iran|Russia|Germany|Netherlands|Turkey|USA|VLESS|VMESS|Trojan|SS|Hysteria|[0-9]+)$' \
              "$file" | grep -q .; then

              echo "ERROR: Old/country/protocol/index remark found in $file"
              bad_remark=1
            fi

          done < <(
            find sub/general \
              -maxdepth 1 \
              -type f \
              -name "*.txt"
          )

          if [ "$bad_remark" -ne 0 ]; then
            echo "ERROR: Remark validation failed!"
            exit 1
          fi

          echo "OK: every config ends with exactly #nukcrow."


      # ==================================================
      # DUPLICATE CHECK
      # ==================================================

      - name: Validate Duplicates
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r file; do

            duplicate="$(
              sort "$file" |
              uniq -d |
              head -n 1
            )"

            if [ -n "$duplicate" ]; then
              echo "ERROR: Duplicate config found in $file"
              echo "$duplicate"
              exit 1
            fi

          done < <(
            find sub/general \
              -maxdepth 1 \
              -type f \
              -name "*.txt"
          )

          echo "OK: no duplicate configs inside subscription files."


      # ==================================================
      # CROSS-FILE DUPLICATE CHECK
      # ==================================================

      - name: Validate General Cross-File Duplicates
        shell: bash
        run: |
          set -euo pipefail

          tmp_file="$(mktemp)"

          trap 'rm -f "$tmp_file"' EXIT

          for i in $(seq 1 10); do
            cat "sub/general/sub${i}.txt" >> "$tmp_file"
          done

          total="$(wc -l < "$tmp_file")"
          unique="$(sort -u "$tmp_file" | wc -l)"

          echo "Total general configs:  $total"
          echo "Unique general configs: $unique"

          if [ "$total" -ne 10000 ]; then
            echo "ERROR: General subscriptions do not contain 10000 lines!"
            exit 1
          fi

          if [ "$unique" -ne 10000 ]; then
            echo "ERROR: Duplicate configs detected across sub1..sub10!"
            exit 1
          fi

          echo "OK: all general subscription files are globally unique."


      # ==================================================
      # FINAL VALIDATION
      # ==================================================

      - name: Final Validation
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "        NUKCROW VALIDATION SUCCESS"
          echo "=========================================="
          echo ""
          echo "Schedule:     Every 3 hours"
          echo "General:      10 files"
          echo "Each general: 1000 configs"
          echo "All configs:  10000 configs"
          echo "Protocols:    1-100 each"
          echo "Operators:    1-200 each"
          echo "Remark:       #nukcrow"
          echo "Random 200:   removed"
          echo "Duplicates:   checked"
          echo "Order:        verified"
          echo ""
          echo "ALL VALIDATIONS PASSED."


      # ==================================================
      # COMMIT
      # ==================================================

      - name: Commit Changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config --local \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git config --local \
            user.name \
            "github-actions[bot]"

          git add sub/

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "NO CHANGES"
            exit 0
          fi

          echo "Changes detected:"
          git diff --cached --stat

          git commit \
            -m "Auto-update subscriptions [$(date -u '+%Y-%m-%d %H:%M UTC')]"

          echo "changed=true" >> "$GITHUB_OUTPUT"


      # ==================================================
      # SAFE REBASE
      # ==================================================

      - name: Rebase Latest Main
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          if ! git rebase origin/main; then
            echo "ERROR: Rebase failed."
            git rebase --abort || true
            exit 1
          fi


      # ==================================================
      # PUSH
      # ==================================================

      - name: Push Changes
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main || {

            echo "First push failed. Fetching latest main..."

            git fetch origin main

            if ! git rebase origin/main; then
              echo "ERROR: Retry rebase failed."
              git rebase --abort || true
              exit 1
            fi

            git push origin HEAD:main
          }

          echo "PUSH SUCCESSFUL"


      # ==================================================
      # PUBLISH RELEASE
      # ==================================================

      - name: Publish Release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="latest"

          echo "Removing previous latest release..."

          gh release delete "$TAG" \
            --cleanup-tag \
            -y || true

          echo "Creating latest release..."

          gh release create "$TAG" \
            sub/general/*.txt \
            --title "Latest configs · $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --notes "Auto-updated every 3 hours. Verified and validated NukCrow subscriptions."

          echo "Release published successfully."


      # ==================================================
      # NO CHANGE RELEASE STATUS
      # ==================================================

      - name: No Changes Status
        if: steps.commit.outputs.changed != 'true'
        shell: bash
        run: |
          echo "No subscription changes detected."
          echo "Release was not recreated."


      # ==================================================
      # FINAL STATUS
      # ==================================================

      - name: Final Status
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "          WORKFLOW FINISHED"
          echo "=========================================="
          echo "UTC: $(date -u)"
          echo ""

          git log -1 --oneline

          echo ""
          echo "Git status:"
          git status --short || true

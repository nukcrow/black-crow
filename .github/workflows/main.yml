name: Update NUKCROW Subscriptions

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nukcrow-subscriptions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run collector
        run: |
          python scripts/switcher.py

      - name: Verify output
        run: |
          test -f sub/general/all_configs.txt
          test -f sub/general/sub1.txt
          test -f sub/general/sub10.txt

          echo "Output verification:"
          wc -l sub/general/all_configs.txt
          wc -l sub/general/sub1.txt
          wc -l sub/general/sub10.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sub/general

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Auto update subscriptions"
            git push
          fi

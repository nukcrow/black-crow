name: Update 5 Personal Subscriptions

on:
  schedule:
    - cron: '0 */3 * * *'  # اجرای اتوماتیک هر ۳ ساعت
  workflow_dispatch:        # قابلیت اجرای دستی

jobs:
  update-subscriptions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Switcher Script
        run: python switcher.py

      - name: Commit and Push to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add sub1.txt sub2.txt sub3.txt sub4.txt sub5.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update 5 subs [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push origin main)

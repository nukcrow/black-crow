name: Update NUKCROW Subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */3 * * *"

permissions:
  contents: write

concurrency:
  group: nukcrow-subscriptions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run subscription collector
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/switcher.py

      - name: Validate subscription files
        shell: bash
        run: |
          set -euo pipefail

          BASE="sub/general"
          BOT="$BASE/bot.txt"

          if [[ ! -d "$BASE" ]]; then
            echo "::error::Directory $BASE does not exist."
            exit 1
          fi

          if [[ ! -f "$BOT" ]]; then
            echo "::error::Missing $BOT"
            exit 1
          fi

          # Verify that all expected subscription files exist.
          for i in $(seq 1 20); do
            FILE="$BASE/sub${i}.txt"

            if [[ ! -f "$FILE" ]]; then
              echo "::error::Missing $FILE"
              exit 1
            fi

            if [[ ! -s "$FILE" ]]; then
              echo "::warning::$FILE is empty."
            fi

            LINES=$(wc -l < "$FILE")
            if (( LINES > 2000 )); then
              echo "::error::$FILE contains $LINES lines; maximum is 2000."
              exit 1
            fi
          done

          BOT_LINES=$(wc -l < "$BOT")
          if (( BOT_LINES > 2000 )); then
            echo "::error::$BOT contains $BOT_LINES lines; maximum is 2000."
            exit 1
          fi

          # Collect totals and check for duplicate entries.
          TOTAL=0
          for i in $(seq 1 20); do
            FILE="$BASE/sub${i}.txt"
            COUNT=$(grep -cve '^[[:space:]]*$' "$FILE" || true)
            TOTAL=$((TOTAL + COUNT))
          done

          BOT_COUNT=$(grep -cve '^[[:space:]]*$' "$BOT" || true)

          echo "## NUKCROW Subscription Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Subscription entries: $TOTAL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bot entries: $BOT_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Maximum lines per file: 2000" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Non-empty lines |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"

          for i in $(seq 1 20); do
            FILE="$BASE/sub${i}.txt"
            COUNT=$(grep -cve '^[[:space:]]*$' "$FILE" || true)
            echo "| sub${i}.txt | $COUNT |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "| bot.txt | $BOT_COUNT |" >> "$GITHUB_STEP_SUMMARY"

          if (( TOTAL < 3000 )); then
            echo "::warning::Total subscription entries are below 3000."
          fi

          if (( BOT_COUNT < 500 )); then
            echo "::warning::Bot entries are below 500."
          fi

          # Report duplicate non-empty lines across subscription files.
          cat "$BASE"/sub{1..20}.txt 2>/dev/null \
            | sed '/^[[:space:]]*$/d' \
            | sort \
            | uniq -d > /tmp/nukcrow-duplicates.txt || true

          DUPLICATES=$(wc -l < /tmp/nukcrow-duplicates.txt)
          if (( DUPLICATES > 0 )); then
            echo "::warning::Found $DUPLICATES duplicate lines across subscription files."
          fi

      - name: Commit and push safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit generated files before rebasing.
          git add -A sub/general

          if git diff --cached --quiet; then
            echo "No subscription changes to commit."
            exit 0
          fi

          git commit -m "Auto update subscriptions"

          # Retry if main advances while this workflow is running.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt of 5"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "::error::Rebase conflict detected. No force push was attempted."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Subscription updates pushed successfully."
              exit 0
            fi

            echo "Push rejected; the remote may have advanced. Retrying..."
            sleep $((attempt * 3))
          done

          echo "::error::Push failed after 5 attempts."
          exit 1

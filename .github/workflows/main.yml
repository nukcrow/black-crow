name: Auto-update Subscriptions

on:
  schedule:
    # Every 3 hours
    - cron: "17 */3 * * *"

  workflow_dispatch:

concurrency:
  group: auto-update-subscriptions
  cancel-in-progress: false

permissions:
  contents: write


jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install Dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            --disable-pip-version-check \
            requests


      # ==========================================
      # SYNC MAIN
      # ==========================================

      - name: Sync with main
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SYNCING REPOSITORY"
          echo "=========================================="

          git fetch origin main

          git checkout main

          git reset --hard origin/main

          echo ""
          echo "Current commit:"
          git log -1 --oneline


      # ==========================================
      # RUN COLLECTOR
      # ==========================================

      - name: Run NukCrow Collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "NUKCROW COLLECTOR"
          echo "=========================================="

          echo ""
          echo "UTC:"
          date -u

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Running collector..."

          python scripts/switcher.py


      # ==========================================
      # CHECK OUTPUT EXISTS
      # ==========================================

      - name: Check Subscription Output
        run: |
          set -euo pipefail

          echo "Checking output..."

          test -d sub/general

          required=(
            all_configs.txt
            sub1.txt
            sub2.txt
            sub3.txt
            sub4.txt
            sub5.txt
            sub6.txt
            sub7.txt
            sub8.txt
            sub9.txt
            sub10.txt
            vless.txt
            vmess.txt
            trojan.txt
            ss.txt
            hysteria2.txt
            best_iran.txt
            mix_iran.txt
            mci.txt
            irancell.txt
            rightel.txt
          )

          for f in "${required[@]}"; do

            if [ ! -f "sub/general/$f" ]; then
              echo "Missing: $f"
              exit 1
            fi

          done


          if [ -f "sub/general/random_200.txt" ]; then
            echo "random_200.txt exists"
            exit 1
          fi


          echo "Output files OK"


      # ==========================================
      # VALIDATE COUNTS
      # ==========================================

      - name: Validate Subscription Counts
        run: |
          set -euo pipefail


          count_lines(){

            grep -cve '^[[:space:]]*$' "$1" || true

          }


          echo "Checking general files"


          for i in $(seq 1 10); do

            file="sub/general/sub${i}.txt"

            count=$(count_lines "$file")

            echo "$file => $count"


            if [ "$count" -ne 1000 ]; then
              exit 1
            fi

          done


          all=$(count_lines sub/general/all_configs.txt)


          if [ "$all" -ne 10000 ]; then
            echo "Invalid all_configs count"
            exit 1
          fi


          echo "Checking Iran files"


          for file in \
            best_iran.txt \
            mix_iran.txt \
            mci.txt \
            irancell.txt \
            rightel.txt

          do

            count=$(count_lines "sub/general/$file")

            echo "$file => $count"


            if [ "$count" -ne 200 ]; then
              exit 1
            fi

          done


          echo "Validation OK"



      # ==========================================
      # COMMIT
      # ==========================================

      - name: Commit Changes
        id: commit

        run: |

          set -euo pipefail


          git config user.name \
          "github-actions[bot]"


          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"


          git add sub/


          if git diff --cached --quiet; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "No changes"

            exit 0

          fi


          git commit \
          -m "Auto-update subscriptions $(date -u '+%Y-%m-%d %H:%M UTC')"


          echo "changed=true" >> "$GITHUB_OUTPUT"



      # ==========================================
      # PUSH
      # ==========================================

      - name: Push Changes

        if: steps.commit.outputs.changed == 'true'

        run: |

          set -euo pipefail


          git push origin main



      # ==========================================
      # FINAL
      # ==========================================

      - name: Final Status

        if: always()

        run: |

          echo "=========================================="
          echo "WORKFLOW FINISHED"
          echo "=========================================="

          date -u

          git log -1 --oneline

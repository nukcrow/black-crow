name: Update NUKCROW Subscriptions

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nukcrow-subscriptions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run collector
        run: python3 -u scripts/switcher.py

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          cd sub/general

          mapfile -t expected < <(printf '%s\n' bot.txt sub{1..20}.txt | sort)
          mapfile -t actual < <(find . -maxdepth 1 -type f -name '*.txt' -printf '%f\n' | sort)
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            echo "Unexpected output files: ${actual[*]}"
            exit 1
          fi

          total=0
          for i in {1..20}; do
            n=$(wc -l < "sub${i}.txt")
            if (( n < 1 || n > 2000 )); then
              echo "sub${i}.txt has $n lines (allowed 1..2000)"
              exit 1
            fi
            total=$((total + n))
          done

          if grep -hqv '#nukcrow$' sub{1..20}.txt; then
            echo "Invalid nukcrow tag found."
            exit 1
          fi

          bot=$(wc -l < bot.txt)
          if (( bot > 5000 )); then echo "bot.txt exceeds 5000"; exit 1; fi
          if (( total < 3000 )); then echo "Only $total configs (floor 3000)"; exit 1; fi

          echo "General: $total / 40000 | Bot: $bot / 5000"
          {
            echo "### NUKCROW"
            echo "- General configs: **$total** / 40000"
            echo "- Bot configs: **$bot** / 5000"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A sub/general
          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Auto update subscriptions"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash
            sleep $((attempt * 3))
          done
          echo "Push failed after 3 attempts"
          exit 1

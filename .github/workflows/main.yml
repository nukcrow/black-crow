name: Update Categorized Subscriptions

on:
  schedule:
    - cron: '0 */3 * * *'  # اجرای هر ۳ ساعت
  workflow_dispatch:

jobs:
  update-subscriptions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Switcher Script
        run: python scripts/switcher.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update protocol & 50-item subs [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push origin main)

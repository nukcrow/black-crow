
name: Update NUKCROW Subscriptions

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nukcrow-subscriptions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collector
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/switcher.py

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          cd sub/general

          expected_file="$(mktemp)"
          actual_file="$(mktemp)"
          trap 'rm -f "$expected_file" "$actual_file"' EXIT

          printf '%s\n' bot.txt sub{1..20}.txt | sort > "$expected_file"
          find . -maxdepth 1 -type f -name '*.txt' -printf '%f\n' | sort > "$actual_file"

          if ! diff -u "$expected_file" "$actual_file"; then
            echo "::error::Generated output files do not match the expected set."
            exit 1
          fi

          total=0
          nonempty=0
          declare -A seen_configs=()

          for i in {1..20}; do
            file="sub${i}.txt"

            if [[ ! -f "$file" ]]; then
              echo "::error::Missing file: $file"
              exit 1
            fi

            n=$(grep -c '.' "$file" || true)

            if (( n > 2000 )); then
              echo "::error::$file has $n lines; maximum is 2000."
              exit 1
            fi

            if (( n > 0 )); then
              nonempty=$((nonempty + 1))
            fi

            total=$((total + n))

            if grep -qv '#nukcrow$' "$file"; then
              echo "::error::Invalid tag found in $file."
              exit 1
            fi

            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ -z "$line" ]] && continue

              config="${line%#nukcrow}"

              if [[ -n "${seen_configs[$config]+x}" ]]; then
                echo "::error::Duplicate configuration found across general subscriptions."
                exit 1
              fi

              seen_configs["$config"]=1
            done < "$file"
          done

          if [[ ! -f bot.txt ]]; then
            echo "::error::bot.txt was not generated."
            exit 1
          fi

          bot=$(grep -c '.' bot.txt || true)

          if (( bot > 2000 )); then
            echo "::error::bot.txt has $bot lines; maximum is 2000."
            exit 1
          fi

          if grep -qv '#nukcrow$' bot.txt; then
            echo "::error::Invalid tag found in bot.txt."
            exit 1
          fi

          if (( total == 0 && bot == 0 )); then
            echo "::error::No usable configurations were generated."
            exit 1
          fi

          if (( nonempty == 0 )); then
            echo "::error::All general subscriptions are empty."
            exit 1
          fi

          if (( total < 3000 )); then
            echo "::warning::Only $total general configurations were generated; target is at least 3000."
          fi

          if (( bot < 500 )); then
            echo "::warning::bot.txt contains only $bot configurations; target is at least 500."
          fi

          echo "General configurations: $total / 40000"
          echo "Non-empty subscriptions: $nonempty / 20"
          echo "Bot configurations: $bot / 2000"

          {
            echo "### NUKCROW Subscription Update"
            echo "- General configurations: **$total / 40000**"
            echo "- Non-empty subscriptions: **$nonempty / 20**"
            echo "- Bot configurations: **$bot / 2000**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A sub/general

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Auto update subscriptions"

          for attempt in 1 2 3; do
            if git push; then
              echo "Changes pushed successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed; syncing with remote."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
            sleep $((attempt * 3))
          done

          echo "::error::Push failed after 3 attempts."
          exit 1

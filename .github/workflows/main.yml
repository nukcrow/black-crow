name: Auto-update Subscriptions

on:
  schedule:
    - cron: "17 */3 * * *"

  workflow_dispatch:


concurrency:
  group: auto-update-subscriptions
  cancel-in-progress: false


permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:


    # ===============================
    # CHECKOUT
    # ===============================

    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: true



    # ===============================
    # PYTHON
    # ===============================

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip



    # ===============================
    # DEPENDENCIES
    # ===============================

    - name: Install Dependencies
      run: |

        python -m pip install --upgrade pip

        pip install requests



    # ===============================
    # SYNC MAIN
    # ===============================

    - name: Sync latest main
      run: |

        set -e

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"


        git fetch origin main


        git checkout main


        git reset --hard origin/main



    # ===============================
    # RUN COLLECTOR
    # ===============================

    - name: Run Collector
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PYTHONUNBUFFERED: "1"

      run: |

        python scripts/switcher.py



    # ===============================
    # COMMIT
    # ===============================

    - name: Commit changes
      id: commit

      run: |

        set -e


        git add sub/


        if git diff --cached --quiet;
        then

          echo "changed=false" >> $GITHUB_OUTPUT

          exit 0

        fi



        git commit \
        -m "Auto update subscriptions $(date -u '+%Y-%m-%d %H:%M UTC')"



        echo "changed=true" >> $GITHUB_OUTPUT




    # ===============================
    # SAFE PUSH
    # ===============================

    - name: Safe push

      if: steps.commit.outputs.changed == 'true'

      run: |

        set -e


        git fetch origin main


        git rebase origin/main



        git push origin HEAD:main



    # ===============================
    # CREATE RELEASE
    # ===============================


    - name: Publish release

      if: steps.commit.outputs.changed == 'true'

      env:

        GH_TOKEN: ${{ github.token }}


      run: |

        set -e


        TAG="latest"



        gh release delete "$TAG" \
        --cleanup-tag \
        -y || true



        gh release create "$TAG" \
        sub/general/*.txt \
        --title "Latest configs · $(date -u +'%Y-%m-%d %H:%M UTC')" \
        --notes "Auto-updated every 3 hours."



    # ===============================
    # FINAL
    # ===============================

    - name: Final Status

      if: always()

      run: |

        echo "======================"

        echo "FINISHED"

        date -u

        echo "======================"

        git log -1 --oneline

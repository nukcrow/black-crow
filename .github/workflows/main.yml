name: Auto-update Subscriptions

on:
  schedule:
    # Every hour
    - cron: "7 * * * *"

  workflow_dispatch:

concurrency:
  group: auto-update-subscriptions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true


      # ==================================================
      # PYTHON
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ==================================================
      # DEPENDENCIES
      # ==================================================

      - name: Install Dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check requests


      # ==================================================
      # XRAY (real end-to-end config test)
      # ==================================================

      - name: Install Xray
        continue-on-error: true
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/xray"

          curl -fsSL --retry 3 \
            -o "$RUNNER_TEMP/xray.zip" \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip

          unzip -q -o "$RUNNER_TEMP/xray.zip" xray -d "$RUNNER_TEMP/xray"
          chmod +x "$RUNNER_TEMP/xray/xray"

          echo "$RUNNER_TEMP/xray" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/xray/xray" version | head -n 1


      # ==================================================
      # STATE CACHE (configs that worked in previous runs)
      # ==================================================

      - name: Restore Good-Config Pool
        uses: actions/cache@v4
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: |
            state-


      # ==================================================
      # SYNC MAIN
      # ==================================================

      - name: Sync Latest Main
        run: |
          set -euo pipefail

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          echo "Current commit:"
          git log -1 --oneline


      # ==================================================
      # RUN COLLECTOR
      # ==================================================

      - name: Run NukCrow Collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          echo "UTC: $(date -u)"
          python --version

          python scripts/switcher.py


      # ==================================================
      # VERIFY OUTPUT DIRECTORY
      # ==================================================

      - name: Verify Output Directory
        run: |
          set -euo pipefail

          if [ ! -d "sub/general" ]; then
            echo "ERROR: sub/general does not exist!"
            exit 1
          fi

          echo "OK: sub/general exists."


      # ==================================================
      # RANDOM 200 MUST NOT EXIST
      # ==================================================

      - name: Verify Random 200 Removed
        run: |
          set -euo pipefail

          if [ -e "sub/general/random_200.txt" ]; then
            echo "ERROR: random_200.txt must NOT exist!"
            exit 1
          fi

          echo "OK: random_200.txt does not exist."


      # ==================================================
      # EXPECTED FILES + UNEXPECTED TXT FILE CHECK
      # ==================================================

      - name: Verify Expected Files
        run: |
          set -euo pipefail

          expected_files=(
            "sub/general/all_configs.txt"

            "sub/general/sub1.txt"
            "sub/general/sub2.txt"
            "sub/general/sub3.txt"
            "sub/general/sub4.txt"
            "sub/general/sub5.txt"
            "sub/general/sub6.txt"
            "sub/general/sub7.txt"
            "sub/general/sub8.txt"
            "sub/general/sub9.txt"
            "sub/general/sub10.txt"

            "sub/general/mci.txt"
            "sub/general/irancell.txt"
            "sub/general/rightel.txt"

            "sub/general/best_iran.txt"
            "sub/general/mix_iran.txt"

            "sub/general/vless.txt"
            "sub/general/vmess.txt"
            "sub/general/trojan.txt"
            "sub/general/ss.txt"
            "sub/general/hysteria2.txt"
          )

          for file in "${expected_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi
          done

          mapfile -t actual_files < <(
            find sub/general -maxdepth 1 -type f -name "*.txt" -printf "%p\n" | sort
          )

          mapfile -t sorted_expected < <(
            printf '%s\n' "${expected_files[@]}" | sort
          )

          if ! diff -u \
            <(printf '%s\n' "${sorted_expected[@]}") \
            <(printf '%s\n' "${actual_files[@]}"); then

            echo "ERROR: Unexpected or missing .txt files detected!"
            exit 1
          fi

          echo "OK: file list is exactly correct."


      # ==================================================
      # COUNTS
      # ==================================================

      - name: Validate Counts
        shell: bash
        run: |
          set -euo pipefail

          count_lines() {
            grep -cve '^[[:space:]]*$' "$1" || true
          }

          check_range() {
            local file="$1" min="$2" max="$3" count

            count="$(count_lines "$file")"
            echo "$file: $count configs"

            if [ "$count" -lt "$min" ] || [ "$count" -gt "$max" ]; then
              echo "ERROR: $file must contain $min-$max configs!"
              exit 1
            fi
          }

          echo "=== ALL CONFIGS ==="

          total="$(count_lines sub/general/all_configs.txt)"
          check_range sub/general/all_configs.txt 10 10000

          echo ""
          echo "=== GENERAL SUBSCRIPTIONS (even split of all_configs) ==="

          base=$((total / 10))
          rem=$((total % 10))

          for i in $(seq 1 10); do
            expected=$base

            if [ "$i" -le "$rem" ]; then
              expected=$((base + 1))
            fi

            check_range "sub/general/sub${i}.txt" "$expected" "$expected"
          done

          echo ""
          echo "=== PROTOCOL SUBSCRIPTIONS ==="

          for proto in vless vmess trojan ss hysteria2; do
            check_range "sub/general/${proto}.txt" 1 100
          done

          echo ""
          echo "=== IRAN / OPERATOR SUBSCRIPTIONS ==="

          for file in \
            sub/general/mci.txt \
            sub/general/irancell.txt \
            sub/general/rightel.txt \
            sub/general/best_iran.txt \
            sub/general/mix_iran.txt
          do
            check_range "$file" 1 200
          done

          echo ""
          echo "OK: all counts are correct."


      # ==================================================
      # VERIFY SUB ORDER
      # ==================================================

      - name: Verify Subscription Order
        shell: bash
        run: |
          set -euo pipefail

          tmp_file="$(mktemp)"

          for i in $(seq 1 10); do
            cat "sub/general/sub${i}.txt" >> "$tmp_file"
          done

          if ! cmp -s "$tmp_file" "sub/general/all_configs.txt"; then
            echo "ERROR: sub1..sub10 do not match all_configs.txt order!"
            rm -f "$tmp_file"
            exit 1
          fi

          rm -f "$tmp_file"

          echo "OK: sub1 -> sub10 exactly match all_configs.txt order."


      # ==================================================
      # EMPTY LINE CHECK
      # ==================================================

      - name: Validate Empty Lines
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            if grep -nE '^[[:space:]]*$' "$file" | grep -q .; then
              echo "ERROR: Empty line found in $file"
              exit 1
            fi
          done < <(find sub/general -maxdepth 1 -type f -name "*.txt")

          echo "OK: no empty lines found."


      # ==================================================
      # PROTOCOL FORMAT CHECK
      # ==================================================

      - name: Validate Protocol Format
        run: |
          set -euo pipefail

          bad_format=0

          while IFS= read -r file; do
            if grep -vE \
              '^(vless|vmess|trojan|ss|hysteria2|hy2)://.+#nukcrow$' \
              "$file" | grep -q .; then

              echo "ERROR: Invalid config format found in $file"
              bad_format=1
            fi
          done < <(find sub/general -maxdepth 1 -type f -name "*.txt")

          if [ "$bad_format" -ne 0 ]; then
            echo "ERROR: Protocol format validation failed!"
            exit 1
          fi

          echo "OK: all configs have valid protocol format."


      # ==================================================
      # REMARK CHECK
      # ==================================================

      - name: Validate Remarks
        run: |
          set -euo pipefail

          bad_remark=0

          while IFS= read -r file; do

            if grep -vE '#nukcrow$' "$file" | grep -q .; then
              echo "ERROR: Invalid remark found in $file"
              bad_remark=1
            fi

            if grep -vE '^([^#]*#nukcrow)$' "$file" | grep -q .; then
              echo "ERROR: Extra remark/fragment found in $file"
              bad_remark=1
            fi

            if grep -E \
              '#(Iran|Russia|Germany|Netherlands|Turkey|USA|VLESS|VMESS|Trojan|SS|Hysteria|[0-9]+)$' \
              "$file" | grep -q .; then

              echo "ERROR: Old/country/protocol/index remark found in $file"
              bad_remark=1
            fi

          done < <(find sub/general -maxdepth 1 -type f -name "*.txt")

          if [ "$bad_remark" -ne 0 ]; then
            echo "ERROR: Remark validation failed!"
            exit 1
          fi

          echo "OK: every config ends with exactly #nukcrow."


      # ==================================================
      # DUPLICATE CHECK
      # ==================================================

      - name: Validate Duplicates
        run: |
          set -euo pipefail

          while IFS= read -r file; do

            duplicate="$(sort "$file" | uniq -d | head -n 1)"

            if [ -n "$duplicate" ]; then
              echo "ERROR: Duplicate config found in $file"
              echo "$duplicate"
              exit 1
            fi

          done < <(find sub/general -maxdepth 1 -type f -name "*.txt")

          echo "OK: no duplicate configs inside subscription files."


      # ==================================================
      # FINAL VALIDATION
      # ==================================================

      - name: Final Validation
        run: |
          echo "VALIDATION SUCCESSFUL"
          echo "General:      10 files, even split (max 1000 each)"
          echo "All configs:  10-10000 (verified only)"
          echo "Protocols:    1-100 each"
          echo "Operators:    1-200 each"
          echo "Remark:       #nukcrow"


      # ==================================================
      # COMMIT
      # ==================================================

      - name: Commit Changes
        id: commit
        run: |
          set -euo pipefail

          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add sub/

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "NO CHANGES"
            exit 0
          fi

          git diff --cached --stat

          git commit -m "Auto-update subscriptions [$(date -u '+%Y-%m-%d %H:%M UTC')]"

          echo "changed=true" >> "$GITHUB_OUTPUT"


      # ==================================================
      # SAFE REBASE + PUSH
      # ==================================================

      - name: Rebase Latest Main
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git fetch origin main
          git rebase origin/main


      - name: Push Changes
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git push origin HEAD:main || {
            echo "First push failed. Retrying..."

            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }

          echo "PUSH SUCCESSFUL"


      # ==================================================
      # PUBLISH RELEASE
      # ==================================================

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="latest"

          gh release delete "$TAG" --cleanup-tag -y || true

          gh release create "$TAG" \
            sub/general/*.txt \
            --title "Latest configs · $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --notes "Auto-updated every hour. Only verified configs."

          echo "Release published successfully."


      # ==================================================
      # FINAL STATUS
      # ==================================================

      - name: Final Status
        if: always()
        run: |
          echo "WORKFLOW FINISHED"
          echo "UTC: $(date -u)"
          git log -1 --oneline
          git status --short

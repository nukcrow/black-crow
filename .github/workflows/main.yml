name: Auto-update Subscriptions

on:
  schedule:
    - cron: '0 */3 * * *'   # اجرای خودکار هر ۳ ساعت یک‌بار
  workflow_dispatch:        # امکان اجرای دستی از تب Actions

jobs:
  # --- مرحله ۱: جمع‌آوری و فیلتر کانفیگ‌های زنده ---
  # مهم نیست کجا اجرا بشه (پینگ اینجا مهم نیست، فقط زنده بودن پورت تست میشه)
  # پس روی رانر ابری گیت‌هاب می‌مونه، رایگان و سریع.
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Subscriptions Switcher
        run: python scripts/switcher.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sub/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update protocol & sub files [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)

  # --- مرحله ۲: رتبه‌بندی بر اساس پینگ واقعی ---
  # این job فقط روی رانر self-hosted (سیستم/سرور خودت) اجرا میشه،
  # چون باید از اینترنت واقعی خودت تست بشه، نه از دیتاسنتر گیت‌هاب.
  # راه‌اندازی: Settings > Actions > Runners > New self-hosted runner
  # روی سیستم خودت نصبش کن و به‌عنوان سرویس (running) نگه‌دار.
  rank:
    needs: fetch
    runs-on: self-hosted

    steps:
      - name: Checkout Repository (latest)
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Pull latest sub files
        run: git pull origin main

      - name: Select Best 30 by Real Ping
        run: python scripts/select_best.py

      - name: Commit and Push best30
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sub/best30.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update best30 by real ping [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)
